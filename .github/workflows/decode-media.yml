name: Decode media
on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/decode-media.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 sources into feed/
        run: |
          set -euo pipefail
          mkdir -p feed
          shopt -s nullglob
          for f in src/*.b64; do
            out="feed/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            echo "decoded $f -> $out ($(wc -c < "$out") bytes)"
          done
          # Large files arrive split: src/<name>.b64.partNN plus a manifest
          # src/<name>.parts (holding the part count) pushed last.
          for m in src/*.parts; do
            name="$(basename "$m" .parts)"
            want="$(tr -dc '0-9' < "$m")"
            parts=( $(ls src/"$name".b64.part* 2>/dev/null | sort) )
            if [ "${#parts[@]}" -ne "$want" ]; then
              echo "waiting for parts of $name (${#parts[@]}/$want)"
              continue
            fi
            cat "${parts[@]}" | tr -d '\n\r ' | base64 -d > "feed/$name"
            echo "decoded $name from $want parts ($(wc -c < "feed/$name") bytes)"
            git rm -q "$m" "${parts[@]}"
          done
      - name: Commit decoded files and remove base64 sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          # The .b64 files are transport-only copies. Remove them in the same
          # commit so the decode commit (the SHA pinned in jsDelivr URLs) holds
          # only real media and the repo stays under jsDelivr's 50 MB limit.
          if compgen -G "src/*.b64" > /dev/null; then
            git rm -q src/*.b64
          fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Decode feed media and remove base64 sources"
          git pull --rebase origin main
          git push
