name: Decode media
on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/decode-media.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 sources into feed/
        run: |
          set -euo pipefail
          mkdir -p feed
          shopt -s nullglob
          for f in src/*.b64; do
            out="feed/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            echo "decoded $f -> $out ($(wc -c < "$out") bytes)"
          done
      - name: Commit and push decoded files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then
            echo "No decoded-file changes"
            exit 0
          fi
          git commit -m "Decode feed graphics from base64 sources"
          git pull --rebase origin main
          git push
